<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrowPanel Survey Emulator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="emulator-shell" aria-label="CrowPanel survey emulator">
    <section class="device" aria-label="480 by 480 round display mockup">
      <div class="bezel">
        <div class="display" id="display" tabindex="0" aria-live="polite"></div>
      </div>
    </section>

    <button class="reset-button" id="resetButton" type="button">Reset emulator</button>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
